[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage is measured against the app package only. Modules that are never
# imported by a test (e.g. the Kokoro voice daemon) simply don't appear in the
# report rather than dragging the number down with untestable ML glue.
addopts =
    -ra
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml

markers =
    llm: live evals that call the real Anthropic API. Skipped unless RUN_LLM_EVALS=1 and a real key is present. Never run in CI.
